name: Reading Room validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reader:
    # Keep the OS within the pinned Playwright version's supported platforms.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Install the locked application and browser dependencies
        run: |
          python3 -m pip install -r services/local/requirements.txt -r tools/browser-requirements.txt
          npm ci --prefix apps/reader
          sudo sed -i '/azure\.archive\.ubuntu\.com/s/priority:1/priority:4/' /etc/apt/apt-mirrors.txt
          python3 -m playwright install --with-deps chromium
      - name: Prepare isolated SQLite with the required WAL fix and FTS5
        run: |
          python3 tools/prepare_ci_sqlite.py --output "$RUNNER_TEMP/ams-sqlite"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ams-sqlite:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Verify the actual SQLite binding
        run: |
          python3 -c "import sqlite3; assert sqlite3.sqlite_version == '3.53.4'; c=sqlite3.connect(':memory:'); c.execute('create virtual table probe using fts5(text)'); print(sqlite3.sqlite_version)"
      - name: Run the provider-neutral source, public and local acceptance entry
        run: python3 -B tools/verify_reader.py --browser
      - name: Keep acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-acceptance
          path: dist/verification/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: reader
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
