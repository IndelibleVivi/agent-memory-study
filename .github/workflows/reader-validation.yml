name: Reading Room validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate canonical data, attribution, search and deterministic studies
        run: python3 -B tools/verify_reader.py
      - name: Install browser-test dependencies
        run: |
          python3 -m pip install -r tools/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check real navigation on the Pages subpath
        run: python3 -B tools/test_reader_browser.py --output-dir dist/browser-check
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-browser-check
          path: dist/browser-check/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build static reading pages
        run: python3 -B tools/seo_build.py
      - name: Verify initial HTML and static navigation
        run: python3 -B tools/test_static_reader.py
      - name: Keep static reader evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-reader-check
          path: dist/static-reader-check/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: reader
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
