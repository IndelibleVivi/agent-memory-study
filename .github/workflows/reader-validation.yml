name: Reading Room validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate canonical data, attribution, search and deterministic studies
        run: python3 -B tools/verify_reader.py
      - name: Install browser-test dependencies
        run: |
          python3 -m pip install -r tools/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check real navigation on the Pages subpath
        run: python3 -B tools/test_reader_browser.py --output-dir dist/browser-check
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-browser-check
          path: dist/browser-check/
          if-no-files-found: ignore
          retention-days: 7
